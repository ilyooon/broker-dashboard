  return new Chart(ctx, {
    type:'bar',
    data:{ labels, datasets:[{ data:vals, backgroundColor:colors,
              borderRadius:3, borderSkipped:false }] },
    options:{

  const invLabels  = (c.inventory||[]).map(x=>x.broker);
  const invVals    = (c.inventory||[]).map(x=>Math.round(x.net));
  const invColors  = (c.inventory||[]).map(x=>CLS_COLOR[x.cls]||'#94a3b8');

  const todayLabels = (c.today_all||[]).map(x=>x.broker);
  const todayVals   = (c.today_all||[]).map(x=>Math.round(x.net));
  const todayColors = (c.today_all||[]).map(x=>CLS_COLOR[x.cls]||'#94a3b8');
  const todayNames  = (c.today_all||[]).map(x=>`${x.broker} ${x.name}`);
  const todayH = Math.max(todayLabels.length * 22, 180);

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-header">
      <span class="tick">${c.tick}</span>
      <span style="color:#9ca3af;font-size:13px">Rp ${c.price?.toLocaleString('en-US')||'—'}</span>
      <span class="signal-badge" style="background:${c.signal_bg}22;color:${c.signal_bg}">
        ${c.signal_icon} ${c.signal}
      </span>
    </div>

    <div class="sm-today">
      <div class="sm-today-label">📊 SM Net Hari Ini (${c.date_today})</div>
      <div class="sm-today-row">
        <div class="sm-net-val" style="color:${c.signal_bg}">
          ${c.net_sm_today>=0?'+':''}${Math.round(c.net_sm_today).toLocaleString('en-US')} lot
        </div>
        <div class="sm-today-detail">
          Retail: ${c.ret_today>=0?'+':''}${Math.round(c.ret_today).toLocaleString('en-US')} lot
        </div>
      </div>
      <div class="broker-chips">${buyChips}${sellChips}</div>
    </div>

    <div class="section-title">🏦 Broker Summary — ${c.date_today}</div>
    <div style="position:relative;height:${todayH}px"><canvas id="bsum${i}"></canvas></div>

    <div class="section-title">📅 SM Net 5 Hari Terakhir</div>
    <div class="history-bar" style="padding-bottom:18px">${histBars}</div>

    <div class="section-title">📦 Inventory Kumulatif YTD</div>
    <div class="stat-row">
      <span>SM Net: <b style="color:${c.inv_sm_net>=0?'#4ade80':'#f87171'}">${c.inv_sm_net>=0?'+':''}${Math.round(c.inv_sm_net).toLocaleString('en-US')} lot</b></span>
      <span>SM Avg Entry: <b>Rp ${c.avg_entry?.toLocaleString('en-US')||'—'}</b></span>
      <span style="color:${c.pnl_pct!=null?(c.pnl_pct>=0?'#4ade80':'#f87171'):'#9ca3af'}">
        ${c.pnl_pct!=null?(c.pnl_pct>=0?'📈':'📉')+' '+(c.pnl_pct>=0?'+':'')+c.pnl_pct+'%':'—'}
      </span>
    </div>
    <div class="chart-wrap"><canvas id="inv${i}"></canvas></div>
  `;
  grid.appendChild(card);
  if (todayLabels.length) new Chart(document.getElementById('bsum'+i), {
    type:'bar',
    data:{ labels:todayLabels, datasets:[{ data:todayVals, backgroundColor:todayColors, borderRadius:3, borderSkipped:false }] },
    options:{
      indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{
          title:(items)=>todayNames[items[0].dataIndex],
          label:(item)=>(item.raw>=0?'Net Buy +':'Net Sell ')+item.raw.toLocaleString('en-US')+' lot'
        } } },
      scales:{
        x:{ grid:{color:'#1f2937'}, ticks:{color:'#6b7280',font:{size:10}} },
        y:{ grid:{display:false}, ticks:{color:'#cbd5e1',font:{size:11,weight:'600'}} }
      }
    }
  });
  if (invLabels.length) barChart(document.getElementById('inv'+i), invLabels, invVals, invColors);
});
</script>
</body>
</html>
